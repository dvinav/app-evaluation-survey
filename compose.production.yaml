name: app-evaluation-survey

services:
  web:
    image: ${APP_IMAGE:-ghcr.io/dvinav/app-evaluation-survey}:${APP_VERSION:?Set APP_VERSION}
    restart: unless-stopped
    container_name: app-evaluation-survey
    env_file: .env
    expose:
      - '3000'
    volumes:
      - ./media:/app/media
    networks:
      proxy:
        aliases:
          - app-evaluation-survey
      database:
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  migrate:
    image: ${APP_IMAGE:-ghcr.io/dvinav/app-evaluation-survey}:${APP_VERSION:?Set APP_VERSION}-migrations
    profiles: [tools]
    env_file: .env
    networks:
      - database

networks:
  proxy:
    external: true
  database:
    external: true
