services:
  db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-survey}
      POSTGRES_USER: ${POSTGRES_USER:-survey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to a ghcr.io image tag or digest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-survey}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-survey}
      MEDIA_DIR: /app/media
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
  migrate:
    image: ${MIGRATION_IMAGE:?Set MIGRATION_IMAGE to the matching ghcr.io migration image}
    profiles: [tools]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-survey}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-survey}
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  media:
